# =============================================================================
# OpenSearch — Hot Node Configuration
# =============================================================================
# This node is the cluster manager and primary data node.
# Data lives on fast NVMe storage (/data/hot/opensearch).
#
# The node.attr.temp=hot tag is used by ISM policies to route
# indices to the correct tier.
#
# Security (Phase F1): the security plugin is ENABLED — transport + HTTP TLS
# with certs from scripts/07-generate-opensearch-certs.sh, users/roles applied
# by scripts/08b-init-opensearch-security.sh.

cluster.name: siem-cluster
node.name: opensearch-hot

# Hot tier — fastest storage
node.attr.temp: hot

# Cluster formation
discovery.seed_hosts:
  - opensearch-hot
  - opensearch-warm
cluster.initial_cluster_manager_nodes:
  - opensearch-hot

# Network
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# ── Security plugin ──────────────────────────────────────────────────────────
# Certs generated by scripts/07-generate-opensearch-certs.sh and mounted at
# /usr/share/opensearch/config/certs (see docker-compose.yml).

# TLS — transport layer (node-to-node, required)
plugins.security.ssl.transport.pemcert_filepath: /usr/share/opensearch/config/certs/opensearch-hot.pem
plugins.security.ssl.transport.pemkey_filepath: /usr/share/opensearch/config/certs/opensearch-hot-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/opensearch/config/certs/root-ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: false

# TLS — HTTP layer (clients: Logstash, Grafana, curl, exporters)
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: /usr/share/opensearch/config/certs/opensearch-hot.pem
plugins.security.ssl.http.pemkey_filepath: /usr/share/opensearch/config/certs/opensearch-hot-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/opensearch/config/certs/root-ca.pem

# DNs must match the certs from 07-generate-opensearch-certs.sh (RFC2253)
plugins.security.authcz.admin_dn:
  - "CN=admin,OU=SIEM,O=siem-docker-stack,C=US"
plugins.security.nodes_dn:
  - "CN=opensearch-hot,OU=SIEM,O=siem-docker-stack,C=US"
  - "CN=opensearch-warm,OU=SIEM,O=siem-docker-stack,C=US"

# Bootstrap the security index from config/opensearch-security on first boot
# (only works once internal_users.yml has been rendered by
# 08b-init-opensearch-security.sh; re-running that script is the canonical way
# to (re)apply security config).
plugins.security.allow_default_init_securityindex: true

# Audit log into the cluster itself
plugins.security.audit.type: internal_opensearch

plugins.security.restapi.roles_enabled:
  - "all_access"
  - "security_rest_api_access"

plugins.security.system_indices.enabled: true
plugins.security.system_indices.indices:
  - ".plugins-ml-*"
  - ".opendistro-alerting-config"
  - ".opendistro-alerting-alert*"
  - ".opendistro-anomaly-results*"
  - ".opendistro-anomaly-detector*"
  - ".opendistro-anomaly-checkpoints"
  - ".opendistro-anomaly-detection-state"
  - ".opendistro-reports-*"
  - ".opensearch-notifications-*"
  - ".opensearch-notebooks"
  - ".opensearch-observability"
  - ".ql-datasources"
  - ".opendistro-asynchronous-search-response*"
  - ".replication-metadata-store"

# ISM (Index State Management) for hot/warm lifecycle
plugins.index_state_management.enabled: true

# Snapshots (Phase F4) — /data/warm/snapshots bind-mounted at /mnt/snapshots.
# Repository registered by scripts/10-snapshot-setup.sh.
path.repo:
  - /mnt/snapshots

# =============================================================================
# Logstash Pipeline — Suricata IDS/IPS
# =============================================================================
# Receives Suricata EVE JSON logs via UDP from pfSense.
#
# pfSense Suricata → UDP 5140 → Logstash → OpenSearch (suricata-YYYY.MM.dd)
#
# To configure pfSense:
#   Suricata → Interfaces → (your WAN) → Eve Output Settings:
#     - Enable Eve JSON log: Yes
#     - Remote log server: <SIEM_HOST_IP>:5140 (UDP)
#     - Send as "flat" JSON (one top-level object per line)

input {
  udp {
    port => 5140
    type => "suricata"
    codec => "json"
  }
}

filter {
  if [type] == "suricata" {
    # Flat EVE JSON (pfSense "flat" output) puts timestamp/event_type at the
    # top level — use those so @timestamp is the event time, not ingest time.
    if [timestamp] {
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    } else if [suricata][eve][timestamp] {
      # Fallback: nested eve fields (non-flat EVE output)
      date {
        match => [ "[suricata][eve][timestamp]", "ISO8601" ]
        target => "@timestamp"
      }
    }

    # Normalize event_type for dashboards (flat JSON already has it top-level)
    if ![event_type] and [suricata][eve][event_type] {
      mutate {
        add_field => { "event_type" => "%{[suricata][eve][event_type]}" }
      }
    }
  }
}

# Secured cluster (Phase F1): https + logstash user, CA-verified TLS.
# OPENSEARCH_LOGSTASH_PASSWORD comes from the container env (docker-compose),
# the CA from the mounted docker/opensearch/certs/root-ca.pem.
output {
  if [type] == "suricata" {
    opensearch {
      hosts => ["https://opensearch-hot:9200"]
      index => "suricata-%{+YYYY.MM.dd}"
      action => "index"
      user => "logstash"
      password => "${OPENSEARCH_LOGSTASH_PASSWORD:changeme-logstash}"
      ssl => true
      ssl_certificate_verification => true
      cacert => "/etc/logstash/certs/root-ca.pem"
    }
  }
}

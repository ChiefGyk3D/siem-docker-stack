# =============================================================================
# Prometheus Configuration
# =============================================================================
# Scrape targets for the SIEM stack. Add additional targets as needed.
#
# Container-internal targets (resolve on the docker network) are defined
# inline below. Host/LAN targets (node_exporter on your machines, GPU
# exporters, etc.) are loaded from JSON files in /etc/prometheus/targets/
# via file_sd_configs so your real IPs stay out of version control.
#
# See docker/prometheus/targets/README.md: copy each *.example.json to the
# real filename (e.g. twingate-ztna.example.json → twingate-ztna.json),
# enter your IPs, and reload Prometheus. Real target files are gitignored.
#
# Default targets:
#   - Prometheus self-monitoring (:9090)
#   - Alertmanager (:9093)
#   - elasticsearch-exporter (:9114) — OpenSearch cluster/index metrics
#   - Grafana (:3000)
#   - cAdvisor (:8080)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Phase F3 — independent alerting path: rules evaluated here, delivered via
# Alertmanager (see docker/prometheus/rules/ and docker/alertmanager/).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # OpenSearch cluster metrics via prometheus-community/elasticsearch_exporter
  # (service elasticsearch-exporter in docker-compose.yml). The exporter holds
  # the readonly credentials via env vars, so no secrets live in this file.
  #
  # NOTE: the old direct scrapes of opensearch-{hot,warm}:9200 at
  # /_prometheus/metrics required the aiven prometheus-exporter plugin, which
  # the stock opensearchproject image does not ship — they never returned
  # metrics. If you install that plugin, re-add the jobs with:
  #   scheme: https
  #   tls_config: { insecure_skip_verify: true }   # self-signed cluster certs
  #   basic_auth: { username: readonly, password_file: <mounted secret> }
  - job_name: 'elasticsearch-exporter'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # node_exporter on the SIEM host itself (optional):
  # copy targets/node.example.json → targets/node.json and adjust.
  - job_name: 'node'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node.json']

  # ===========================================================================
  # Infrastructure Node Exporters
  # ===========================================================================
  # Targets and per-host labels (instance_name, role) live in the JSON files.
  - job_name: 'twingate-ztna'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/twingate-ztna.json']

  - job_name: 'unifi-controller'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/unifi-controller.json']

  - job_name: 'Cryptocurrency'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/Cryptocurrency.json']

  - job_name: 'AI'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/AI.json']

  - job_name: 'Security'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/Security.json']

  - job_name: 'Computers'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/Computers.json']

  # cAdvisor — container metrics (service defined in docker-compose.yml)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ===========================================================================
  # NVIDIA GPU Monitoring
  # ===========================================================================
  # Linux machines use dcgm-exporter (:9400)
  # Windows machines use nvidia_gpu_exporter (:9835)
  # See docs/gpu-monitoring.md for installation instructions.
  #
  # These jobs scrape nothing until you create the target files:
  # copy targets/nvidia-dcgm.example.json → targets/nvidia-dcgm.json (and the
  # Windows equivalent) and fill in the real exporter IPs.
  - job_name: 'nvidia-dcgm'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/nvidia-dcgm.json']

  - job_name: 'nvidia-gpu-windows'
    scrape_interval: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/nvidia-gpu-windows.json']

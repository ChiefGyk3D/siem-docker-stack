# =============================================================================
# Prometheus Configuration
# =============================================================================
# Scrape targets for the SIEM stack. Add additional targets as needed.
#
# Default targets:
#   - Prometheus self-monitoring (:9090)
#   - OpenSearch hot node (:9200)
#   - OpenSearch warm node (:9201)
#   - Grafana (:3000)
#
# Optional targets (uncomment as needed):
#   - node_exporter (:9100) — installed on the host
#   - cAdvisor (:8080) — Docker container metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'opensearch-hot'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['opensearch-hot:9200']

  - job_name: 'opensearch-warm'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['opensearch-warm:9200']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Uncomment if you install node_exporter on the host:
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['host.docker.internal:9100']

  # ===========================================================================
  # Infrastructure Node Exporters
  # ===========================================================================
  - job_name: 'twingate-ztna'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.0.2.10:9100']
        labels:
          instance_name: 'twingate-connector-01'
          role: 'ztna-connector'
      - targets: ['192.0.2.11:9100']
        labels:
          instance_name: 'twingate-connector-02'
          role: 'ztna-connector'

  - job_name: 'unifi-controller'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.0.2.10:9100']
        labels:
          instance_name: 'unifi-controller'
          role: 'network-management'

  - job_name: 'Cryptocurrency'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.0.2.10:9100']
        labels:
          instance_name: 'pi-node-01'
          role: 'cryptocurrency-node'

  - job_name: 'AI'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.0.2.10:9100']
        labels:
          instance_name: 'gpu-host-01'
          role: 'ai-inference'

  - job_name: 'Security'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.0.2.100:9100']
        labels:
          instance_name: 'host-01'
          role: 'siem-server'

  - job_name: 'Computers'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.0.2.20:9100']
        labels:
          instance_name: 'workstation-02'
          role: 'workstation'

  # cAdvisor — container metrics (service defined in docker-compose.yml)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ===========================================================================
  # NVIDIA GPU Monitoring
  # ===========================================================================
  # Linux machines use dcgm-exporter (:9400)
  # Windows machines use nvidia_gpu_exporter (:9835)
  # See docs/gpu-monitoring.md for installation instructions.

  # NOTE: Prometheus does NOT expand environment variables in this file —
  # placeholders like GPU_WORKSTATION_IP would be permanently-DOWN targets.
  # Substitute the real IP of each exporter host, then uncomment the job.
  # - job_name: 'nvidia-dcgm'
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ['GPU_WORKSTATION_IP:9400']      # replace with a real IP
  #       labels:
  #         instance_name: 'workstation'
  #         gpu_role: 'desktop'
  #     - targets: ['GPU_LLM_SERVER_IP:9400']       # replace with a real IP
  #       labels:
  #         instance_name: 'llm-server'
  #         gpu_role: 'inference'
  #     # Uncomment when transcoding server VLAN is ready:
  #     # - targets: ['TRANSCODE_SERVER_IP:9400']
  #     #   labels:
  #     #     instance_name: 'transcode-server'
  #     #     gpu_role: 'transcode'

  # - job_name: 'nvidia-gpu-windows'
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ['GPU_WINDOWS_STREAMING_IP:9835']  # replace with a real IP
  #       labels:
  #         instance_name: 'streaming-pc'
  #         gpu_role: 'streaming'

# Infrastructure host-down and disk-full alerts (issue #224). Provisioned into Grafana.
#
# Why Grafana-managed rules: this stack runs no Alertmanager container, so the
# Prometheus-native rules (docker/prometheus/rules/) cannot alert. These rules
# query Prometheus through the Prometheus data source (uid `prometheus`,
# datasources.yml) and Grafana routes them through the n8n router like every
# other rule. See docs/infrastructure-alerts.md for the job-to-severity table,
# the migration from the hand-made live rules and the rollback.
#
# Jobs: twingate-ztna and unifi-controller are the critical infrastructure and
# page the phone (phone "true", tier P1) for host down and disk almost full.
# Security, AI, Cryptocurrency, grafana and prometheus are warnings with no
# phone. The Computers job (laptops) has NO rule on purpose: a laptop that sleeps
# or leaves the network is normal and must never page.
#
# No-data: the critical rules use noDataState Alerting, because a job that has
# vanished from Prometheus must alert, not look healthy. The disk rules ship
# PAUSED: the node_filesystem_* metrics are unverified on the critical jobs, and
# an unpaused rule with noDataState Alerting would page at once if they are
# absent. Unpause after the check in docs/infrastructure-alerts.md.
#
# Titles differ from the live hand-made "Host Down" and "Disk Usage Critical"
# on purpose (owner retires those after these work). The titles are not on the
# router's ALLOWED_ALERTNAMES, so they page at Pushover priority 1, not 2.
# There is no update_alert label: no update policy route matches them.
apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure hosts
    folder: Infrastructure Alerts
    interval: 1m
    rules:
      # Critical infrastructure up below 1, or no data (vanished job): pages the phone.
      - uid: infra-host-down-critical
        title: "Infrastructure host down (critical)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: 'min by (job, instance) (up{job=~"twingate-ztna|unifi-controller"})'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        isPaused: false
        annotations:
          summary: "Critical infrastructure target {{ $labels.job }} {{ $labels.instance }} is down"
          description: "Prometheus reports up below 1 for a critical infrastructure target for 5 minutes, or the job has no data at all. Check the host and its exporter."
        labels:
          severity: "critical"
          tier: "P1"
          phone: "true"
          alert_group: "infrastructure"

      # Other host groups: warning, Discord only.
      - uid: infra-host-down-other
        title: "Infrastructure host down (warning)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: 'min by (job, instance) (up{job=~"Security|AI|Cryptocurrency|grafana|prometheus"})'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        isPaused: false
        annotations:
          summary: "Target {{ $labels.job }} {{ $labels.instance }} is down"
          description: "Prometheus reports up below 1 for 5 minutes, or the job has no data. Discord only, no phone. The Computers job is deliberately not covered."
        labels:
          severity: "warning"
          tier: "P2"
          phone: "false"
          alert_group: "infrastructure"

      # Critical infrastructure disk over 85 percent: pages the phone. Ships paused, see the header.
      - uid: infra-disk-critical
        title: "Infrastructure disk almost full (critical)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: '100 * (1 - node_filesystem_avail_bytes{job=~"twingate-ztna|unifi-controller",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job=~"twingate-ztna|unifi-controller",fstype!~"tmpfs|overlay|squashfs"})'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [85]}}]}
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        isPaused: true
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.job }} {{ $labels.instance }} is over 85 percent full"
          description: "Filesystem used percent is above 85 for 5 minutes on a critical infrastructure host (tmpfs, overlay and squashfs excluded), or the metric has vanished. Free space now."
        labels:
          severity: "critical"
          tier: "P1"
          phone: "true"
          alert_group: "infrastructure"

      # Other node jobs: warning, Discord only. No data is OK (not every job has node metrics).
      - uid: infra-disk-other
        title: "Infrastructure disk almost full (warning)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: '100 * (1 - node_filesystem_avail_bytes{job=~"Security|AI|Cryptocurrency",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job=~"Security|AI|Cryptocurrency",fstype!~"tmpfs|overlay|squashfs"})'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [85]}}]}
        noDataState: OK
        execErrState: Alerting
        for: 5m
        isPaused: true
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.job }} {{ $labels.instance }} is over 85 percent full"
          description: "Filesystem used percent is above 85 for 5 minutes (tmpfs, overlay and squashfs excluded). Discord only, no phone. No data is healthy here: not every job runs a node exporter."
        labels:
          severity: "warning"
          tier: "P2"
          phone: "false"
          alert_group: "infrastructure"

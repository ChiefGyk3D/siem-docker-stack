# Grafana notification failure alert (issue #81). Provisioned into Grafana.
#
# Fires when Grafana itself failed to deliver a notification through any
# contact point (webhook to n8n, Discord, email, ...) in the last 10 minutes.
# It catches a delivery that Grafana knows failed: n8n down, a refused
# connection, a rejected secret header, a 5xx from the router. It does NOT catch
# a router that answers 200 and then drops the alert; that is #78 (delivery
# failure reporting) and #80 (alert path heartbeat).
#
# Data: Grafana's own /metrics, scraped by the `grafana` job in
# docker/prometheus/prometheus.yml and read through the Prometheus data source
# (uid `prometheus`, datasources.yml). To use another data source, change
# datasourceUid in query A and nothing else.
#
# UNVERIFIED metric name: grafana_alerting_notifications_failed_total
# {integration,org} is the name Grafana's documentation lists. On a live
# Grafana 12.4 (2026-11-19) the siblings grafana_alerting_notifications_total
# and grafana_alerting_notification_requests_total exist, but the failed
# counter did not, because Grafana creates a labeled counter only after its
# first event. Confirm the name after forcing one failed delivery
# (docs/notification-failure-alerts.md). If it differs, change the one name in
# query A. Until the series exists, the query returns no data, which is the
# healthy state (see noDataState).
#
# Window: the 10m in the query A expression is the only place the look-back
# lives. The 5m `for` below keeps one failed delivery that later recovers from
# alerting; change both to taste. The relativeTimeRange only has to cover the
# window, it is not the window. Note that increase() needs two samples in the
# window, so the very first failure after Grafana creates the series may show
# as 0 until the next scrape sees a higher value.
#
# Routing: the label delivery_failure=true is what moves this alert off the
# possibly failing path. The example policy
# (notification-failure-notification-policy.yml.example) sends it to the
# `discord-direct` contact point (notification-failure-contact-point.yml.example),
# a direct Discord webhook that does not go through n8n. An alert about failed
# deliveries must never depend on the delivery that failed. The labels carry no
# update_alert or heartbeat label and phone is "false" (docs/alert-taxonomy.md
# requires the label; the email P1 route needs phone "true"), so the
# update-alert, heartbeat and email routes never match it and the router never
# sees it. To route it elsewhere,
# change the receiver on the policy route, not this rule.
#
# State handling:
# - noDataState OK: the counter series does not exist until a first failure, so
#   no data means no failures. Alerting here would fire on every healthy stack.
# - execErrState Alerting: if the query itself fails (Prometheus down, bad
#   credentials), failures could be happening unseen, so the safer state is to
#   raise the alert. It goes to the direct Discord channel, not n8n.
#
# The folder is created by Grafana on provisioning if it does not exist.
apiVersion: 1

groups:
  - orgId: 1
    name: Notification delivery
    folder: Alert Path
    interval: 1m
    rules:
      - uid: grafana-notification-failures
        title: "Grafana notification delivery failing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: 'sum by (integration) (increase(grafana_alerting_notifications_failed_total[10m]))'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: max, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: Alerting
        for: 5m
        isPaused: false
        annotations:
          summary: "Grafana failed to deliver notifications through {{ $labels.integration }}"
          description: "Grafana's own failed-notification counter increased in the last 10 minutes, so alerts may not be reaching their receiver. Check the contact point and the receiver behind it. Sent through the direct Discord contact point, not n8n. The metric name is unverified, see docs/notification-failure-alerts.md."
        labels:
          severity: "warning"
          tier: "P2"
          phone: "false"
          alert_group: "alert-path"
          delivery_failure: "true"

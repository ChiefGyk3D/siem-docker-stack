# UniFi pending-update alerts (issue #53). Provisioned into Grafana.
#
# Data: the UniFi poller (unpoller) writes one InfluxDB measurement per device
# type (uap, usw, ugw, udm, uxg) into database `unpoller`, with a boolean
# field `upgradable` and the device `name` as a tag. That schema comes from
# the unpoller documentation; it is not checked against a live database in
# this repo. Verify with: SHOW FIELD KEYS ON unpoller FROM usw
#
# Behavior: an alert instance exists per device while `upgradable` is true.
# It escalates from warning (pending more than 24h) to critical (pending
# more than 7 days). It clears only when the device stops reporting
# `upgradable = true`, that is, when the update is applied. There is no
# manual override. Missing data (noDataState OK) never pages.
# Repeat intervals come from the notification policy
# (update-notification-policy.yml.example).
apiVersion: 1

groups:
  - orgId: 1
    name: Update pending - UniFi
    folder: Update Alerts
    interval: 5m
    rules:
      - uid: update-unifi-pending-24h
        title: "UniFi update pending over 24h"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb-unifi
            model:
              refId: A
              datasource: {type: influxdb, uid: influxdb-unifi}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT count("upgradable") FROM /^(uap|usw|ugw|udm|uxg)$/ WHERE "upgradable" = true AND time > now() - 5m GROUP BY "name"
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: OK
        for: 24h
        isPaused: false
        annotations:
          summary: "UniFi device {{ $labels.name }} has had an update pending for over 24 hours"
          description: "Apply the pending UniFi firmware update. This alert clears only when the device reports no pending update."
        labels:
          severity: "warning"
          source: "unifi"
          alert_group: "updates"
          update_alert: "true"

      - uid: update-unifi-pending-7d
        title: "UniFi update pending over 7 days"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb-unifi
            model:
              refId: A
              datasource: {type: influxdb, uid: influxdb-unifi}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT count("upgradable") FROM /^(uap|usw|ugw|udm|uxg)$/ WHERE "upgradable" = true AND time > now() - 5m GROUP BY "name"
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: OK
        for: 168h
        isPaused: false
        annotations:
          summary: "UniFi device {{ $labels.name }} has had an update pending for over 7 days"
          description: "Escalated: the update has been pending for over 7 days. Apply it. This alert clears only when the device reports no pending update."
        labels:
          severity: "critical"
          source: "unifi"
          alert_group: "updates"
          update_alert: "true"

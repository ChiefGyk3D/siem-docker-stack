# UniFi pending-update alerts (issue #53). Provisioned into Grafana.
#
# Data: the UniFi poller (unpoller) writes one InfluxDB measurement per device
# type (uap, usw, ugw, udm, uxg) into database `unpoller`, with a boolean
# field `upgradeable` (spelled with an "e") and the device `name` as a tag.
# Verified on 2026-11-18 against a live unpoller database: measurements uap and
# usw (plus clients, subsystems and others), the boolean field `upgradeable`
# on usw and uap, the `name` tag, and a write interval of about 30 seconds per
# device, so the hourly bucket logic has data. The regex also lists ugw, udm
# and uxg for stacks that have those devices. Re-check with:
# SHOW FIELD KEYS ON unpoller FROM usw
#
# Behavior: an alert instance exists per device while `upgradeable` is true.
# The warning covers pending for about 24h up to about 7 days; the critical
# covers about 7 days and more. Grafana-managed alerting has no inhibit rule,
# so the two are made exclusive in the queries, and both clocks are in the
# condition, not in `for` (both rules use `for: 0s`): a `for` clock restarts
# whenever the data has a gap, which would hide an unpatched device for a
# day. Query P counts the hourly buckets in the last 7 days that held a
# pending point. Warning: 24 to 159 buckets. Critical: 160 or more. The 160 is
# the same number in both rules, so there is no overlap and no gap. The 160
# (not 168) is a tolerance of about 8 hours of missing data per week, so a short
# poller or controller outage does not drop a critical back to a warning. Both
# rules also need the pending-now check (B > 0). The rules clear only when the
# device stops reporting `upgradeable = true`, that is, when the update is
# applied. There is no manual override. Missing data (noDataState OK) never
# pages.
# Repeat intervals come from the notification policy
# (update-notification-policy.yml.example).
apiVersion: 1

groups:
  - orgId: 1
    name: Update pending - UniFi
    folder: Update Alerts
    interval: 5m
    rules:
      - uid: update-unifi-pending-24h
        title: "UniFi update pending over 24h"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb-unifi
            model:
              refId: A
              datasource: {type: influxdb, uid: influxdb-unifi}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT count("upgradeable") FROM /^(uap|usw|ugw|udm|uxg)$/ WHERE "upgradeable" = true AND time > now() - 5m GROUP BY "name"
          - refId: P
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: influxdb-unifi
            model:
              refId: P
              datasource: {type: influxdb, uid: influxdb-unifi}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT count("upgradeable") FROM /^(uap|usw|ugw|udm|uxg)$/ WHERE "upgradeable" = true AND time > now() - 7d GROUP BY time(1h), "name"
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: Pc
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: Pc, type: reduce, expression: P, reducer: count, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: math, expression: "$B > 0 && $Pc >= 24 && $Pc < 160"}
        noDataState: OK
        execErrState: OK
        for: 0s
        isPaused: false
        annotations:
          summary: "UniFi device {{ $labels.name }} has had an update pending for over 24 hours"
          description: "Apply the pending UniFi firmware update. This alert clears only when the device reports no pending update."
        labels:
          severity: "warning"
          source: "unifi"
          alert_group: "updates"
          update_alert: "true"

      - uid: update-unifi-pending-7d
        title: "UniFi update pending over 7 days"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb-unifi
            model:
              refId: A
              datasource: {type: influxdb, uid: influxdb-unifi}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT count("upgradeable") FROM /^(uap|usw|ugw|udm|uxg)$/ WHERE "upgradeable" = true AND time > now() - 5m GROUP BY "name"
          - refId: P
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: influxdb-unifi
            model:
              refId: P
              datasource: {type: influxdb, uid: influxdb-unifi}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT count("upgradeable") FROM /^(uap|usw|ugw|udm|uxg)$/ WHERE "upgradeable" = true AND time > now() - 7d GROUP BY time(1h), "name"
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: Pc
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: Pc, type: reduce, expression: P, reducer: count, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: math, expression: "$B > 0 && $Pc >= 160"}
        noDataState: OK
        execErrState: OK
        for: 0s
        isPaused: false
        annotations:
          summary: "UniFi device {{ $labels.name }} has had an update pending for over 7 days"
          description: "Escalated: the update has been pending for over 7 days. Apply it. This alert clears only when the device reports no pending update."
        labels:
          severity: "critical"
          source: "unifi"
          alert_group: "updates"
          update_alert: "true"

# UniFi backup health alerts (issue #228). Provisioned PAUSED.
#
# These rules ship paused (isPaused: true) like the pfSense rules. Enable them (set isPaused to
# false and restart Grafana) only once the delivery route for the metrics of
# scripts/unifi-backup-sync.sh is chosen, built and the metrics are arriving. The delivery route is
# NOT decided; see docs/unifi-pi-backup.md. Until then the rules read nothing.
#
# The queries assume the metrics land in the InfluxDB database behind the datasource
# influxdb-pfsense (database "pfsense"). If the route writes elsewhere, change datasourceUid and
# the query in all three rules.
#
# Thresholds (owner decision 2026-11-27: "Warn at 8 days, critical at 15"), measured on the age
# of the NEWEST backup, once for the Pi ("local") and once for the NAS copy ("nas"):
#   warning  : age above 8 days  (691200 s) up to and including 15 days (1296000 s)
#   critical : age above 15 days (1296000 s)
# The two age rules are exclusive (the warning has an upper bound equal to the critical lower
# bound), because Grafana-managed alerting has no inhibit rule: a 16-day-old backup raises one
# alert, not two. A rule clears only when a newer backup brings the age back down.
# The third rule fires when the sync job reported a failure, or reported nothing for 36 hours
# (the timer runs daily, so one missed run is tolerated). noDataState is OK on the two age rules
# because the third rule owns "no report"; execErrState is Alerting on all three.
# Labels: only severity, tier, phone, alert_group (backup) and source, as docs/alert-taxonomy.md allows. phone=true is the only way to the
# phone (Pushover). The repeat intervals (84h warning, 24h critical) come from
# unifi-backup-notification-policy.yml.example, which an operator merges into the policy tree.
apiVersion: 1

groups:
  - orgId: 1
    name: UniFi backup health
    folder: Backup Alerts
    interval: 15m
    rules:
      - uid: unifi-backup-stale-8d
        title: "UniFi backup older than 8 days"
        condition: D
        data:
          - refId: A
            relativeTimeRange: {from: 172800, to: 0}
            datasourceUid: influxdb-pfsense
            model:
              refId: A
              datasource: {type: influxdb, uid: influxdb-pfsense}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT last("value") FROM "unifi_backup_newest_age_seconds" WHERE time > now() - 48h GROUP BY "where"
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: math, expression: "$B > 691200 && $B <= 1296000"}
          - refId: D
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: D, type: threshold, expression: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: Alerting
        for: 0s
        isPaused: true
        annotations:
          summary: "The newest UniFi backup ({{ $labels.where }}) is more than 8 days old"
          description: "The Pi (local) or the NAS copy (nas) has no backup newer than 8 days. UniFi OS writes one weekly; check the backup schedule and the sync (docs/unifi-pi-backup.md). This alert clears when a newer backup arrives."
        labels:
          severity: "warning"
          tier: "P2"
          alert_group: "backup"
          source: "unifi"
          phone: "true"

      - uid: unifi-backup-stale-15d
        title: "UniFi backup older than 15 days"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 172800, to: 0}
            datasourceUid: influxdb-pfsense
            model:
              refId: A
              datasource: {type: influxdb, uid: influxdb-pfsense}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT last("value") FROM "unifi_backup_newest_age_seconds" WHERE time > now() - 48h GROUP BY "where"
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [1296000]}}]}
        noDataState: OK
        execErrState: Alerting
        for: 0s
        isPaused: true
        annotations:
          summary: "The newest UniFi backup ({{ $labels.where }}) is more than 15 days old"
          description: "Escalated: the Pi (local) or the NAS copy (nas) has had no new backup for over 15 days. Restore options are shrinking. This alert clears when a newer backup arrives."
        labels:
          severity: "critical"
          tier: "P1"
          alert_group: "backup"
          source: "unifi"
          phone: "true"

      - uid: unifi-backup-sync-failed
        title: "UniFi backup sync failed or not reporting"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 129600, to: 0}
            datasourceUid: influxdb-pfsense
            model:
              refId: A
              datasource: {type: influxdb, uid: influxdb-pfsense}
              rawQuery: true
              resultFormat: time_series
              query: >-
                SELECT last("value") FROM "unifi_backup_sync_success" WHERE time > now() - 36h
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        isPaused: true
        annotations:
          summary: "The UniFi backup sync failed, or has not reported for over 36 hours"
          description: "unifi_backup_sync_success is 0 or missing. Check the journal of unifi-backup-sync.service on the Pi; the result code says what failed (docs/unifi-pi-backup.md). Backup age alerts cannot be trusted until the sync reports again."
        labels:
          severity: "critical"
          tier: "P1"
          alert_group: "backup"
          source: "unifi"
          phone: "true"

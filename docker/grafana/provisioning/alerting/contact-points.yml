# Contact point for the n8n Grafana Alert Router (issue #53).
# n8n fans each alert out to Discord (always) and Pushover (when
# PUSHOVER_ENABLED=true in n8n). The URL holds no secret. Adjust the host name
# if n8n is not reachable as `n8n` from the Grafana container.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: n8n-grafana-router
    receivers:
      - uid: n8n-grafana-router
        type: webhook
        settings:
          url: http://n8n/webhook/grafana-alerts
          httpMethod: POST
          # Sent as "Authorization: Bearer <value>". Grafana interpolates
          # $VARIABLE from its container environment (see
          # docs/update-alerting.md). The n8n Header Auth credential
          # grafana-webhook-auth must hold the same value. Never put the value here.
          authorization_scheme: Bearer
          authorization_credentials: $GRAFANA_WEBHOOK_SECRET
        disableResolveMessage: false

# =============================================================================
# Grafana — Datasource Provisioning
# =============================================================================
# Auto-provisions datasources on first boot.
# All URLs use Docker service names (resolved via the siem-net network).
#
# Datasources:
#   1. OpenSearch — Suricata IDS/IPS indices (suricata-*)
#   2. OpenSearch — Syslog indices (syslog-*, pfsense-*, unifi-*)
#   3. OpenSearch — pfBlockerNG indices (pfblockerng-*)
#   4. OpenSearch — Wazuh alerts (wazuh-alerts-* on the Wazuh indexer)
#   5. OpenSearch — CrowdSec events (crowdsec-events-*)
#   6. InfluxDB — pfSense/Telegraf/UniFi metrics
#   7. Prometheus — Infrastructure metrics
#
# $WAZUH_INDEXER_PASSWORD is interpolated by Grafana from the container
# environment (set in docker-compose.yml from .env).

apiVersion: 1

datasources:
  # --- OpenSearch: Suricata IDS/IPS ---
  - name: OpenSearch-Suricata
    uid: opensearch-suricata
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch-hot:9200
    database: "suricata-*"
    isDefault: true
    jsonData:
      timeField: "@timestamp"
      version: "2.19.0"
      flavor: "opensearch"
      logMessageField: ""
      logLevelField: ""

  # --- OpenSearch: Syslog / pfSense / UniFi ---
  - name: OpenSearch-Syslog
    uid: opensearch-syslog
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch-hot:9200
    database: "syslog-*"
    jsonData:
      timeField: "@timestamp"
      version: "2.19.0"
      flavor: "opensearch"

  # --- OpenSearch: pfBlockerNG ---
  - name: OpenSearch-pfBlockerNG
    uid: opensearch-pfblockerng
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch-hot:9200
    database: "pfblockerng-*"
    jsonData:
      timeField: "@timestamp"
      version: "2.19.0"
      flavor: "opensearch"

  # --- OpenSearch: Wazuh alerts (dedicated Wazuh indexer, self-signed TLS) ---
  - name: OpenSearch-Wazuh
    uid: opensearch-wazuh
    type: grafana-opensearch-datasource
    access: proxy
    url: https://wazuh-indexer:9200
    database: "wazuh-alerts-*"
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: $WAZUH_INDEXER_PASSWORD
    jsonData:
      timeField: "@timestamp"
      version: "2.19.0"
      flavor: "opensearch"
      tlsSkipVerify: true

  # --- OpenSearch: CrowdSec events ---
  - name: OpenSearch-CrowdSec
    uid: opensearch-crowdsec
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch-hot:9200
    database: "crowdsec-events-*"
    jsonData:
      timeField: "@timestamp"
      version: "2.19.0"
      flavor: "opensearch"

  # --- InfluxDB: pfSense + Telegraf + UniFi Poller ---
  - name: InfluxDB
    uid: influxdb-pfsense
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: pfsense
    jsonData:
      httpMode: GET

  # --- InfluxDB: UniFi Poller ---
  - name: InfluxDB-UniFi
    uid: influxdb-unifi
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: unpoller
    jsonData:
      httpMode: GET

  # --- Prometheus ---
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

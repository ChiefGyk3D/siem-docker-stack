# =============================================================================
# Wazuh Dashboard — OpenSearch Dashboards Configuration
# =============================================================================
# Maps to /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
# in the wazuh-dashboard container.

server.host: "0.0.0.0"
server.port: 443
opensearch.hosts: https://wazuh-indexer:9200

# TLS
server.ssl.enabled: true
server.ssl.key: "/etc/wazuh-dashboard/certs/dashboard-key.pem"
server.ssl.certificate: "/etc/wazuh-dashboard/certs/dashboard.pem"

opensearch.ssl.certificateAuthorities: ["/etc/wazuh-dashboard/certs/root-ca.pem"]
opensearch.ssl.verificationMode: certificate

# Authentication: the kibanaserver service user. The password is read from the
# container environment (DASHBOARD_PASSWORD <- WAZUH_DASHBOARD_PASSWORD in
# .env); there is no usable default. The same value must be set on the
# indexer side with change-passwords.sh (README, "Upgrade notes").
opensearch.username: "kibanaserver"
opensearch.password: "${DASHBOARD_PASSWORD}"

# Wazuh plugin
opensearch.requestHeadersAllowlist: ["securitytenant","Authorization"]
opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles: ["kibana_read_only"]

# Branding
uiSettings.overrides.defaultRoute: /app/wazuh

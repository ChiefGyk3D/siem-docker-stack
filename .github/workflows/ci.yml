# CI for siem-docker-stack. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@7501cb3fa19d83d0e0a131cb040e7c4da32a9504 # v1.28.0
    permissions:
      contents: read
    with:
      shfmt-args: -i 4 -ci
      # Pre-existing findings, visible but not failing until the scripts are
      # cleaned up: 7 shellcheck warnings in 6 files and 60 shfmt hunks in
      # 13 of 14 scripts (per-file counts in the pull request). The old gate
      # was shellcheck at --severity=error, which is clean.
      shellcheck-continue-on-error: true
      shfmt-continue-on-error: true
      # The old ci.yml's non-shell checks, kept as the test, in its own order:
      # compose, promtool, amtool, logstash, Wazuh XML and rule ids, pytest.
      test-install-command: python3 -m pip install --user pytest requests pyyaml
      test-command: |
        # required secrets are ${VAR:?}; tests/compose.ci.env supplies throwaway values
        (cd docker && docker compose --env-file ../tests/compose.ci.env -f docker-compose.yml config --quiet)
        stage=$(mktemp -d)
        cp -r docker/prometheus/. "$stage/"
        for f in "$stage"/targets/*.example.json; do cp "$f" "${f%.example.json}.json"; done
        # promtool runs as nobody in the container; mktemp dirs are 0700
        # throwaway bcrypt hash made at run time (no hash literal lives in the repo)
        hash=$(docker run --rm httpd:2.4 htpasswd -nbBC 4 ci ci-only-placeholder | cut -d: -f2)
        mkdir -p "$stage/secrets" && for n in self-scrape otlp-scrape; do echo ci-only > "$stage/secrets/$n-password"; done && sed "s|REPLACE_WITH_BCRYPT_HASH|$hash|" "$stage/web.yml.example" > "$stage/web.yml"
        mkdir -p "$stage/otlp-ca" && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci-throwaway" \
          -keyout /dev/null -out "$stage/otlp-ca/otlp-ca.crt"
        chmod -R a+rX "$stage"
        docker run --rm --entrypoint promtool -v "$stage":/etc/prometheus:ro \
          prom/prometheus:v3.10.0 check config /etc/prometheus/prometheus.yml
        docker run --rm --entrypoint /bin/sh -v "$stage":/etc/prometheus:ro \
          prom/prometheus:v3.10.0 -c 'promtool check rules /etc/prometheus/rules/*.yml'
        docker run --rm --entrypoint promtool -v "$stage":/etc/prometheus:ro \
          prom/prometheus:v3.10.0 check web-config /etc/prometheus/web.yml
        # the OTLP receiver instance: its config (window, otlp block) and its web config
        otlp=$(mktemp -d)
        cp -r docker/prometheus-otlp/. "$otlp/"
        mkdir -p "$otlp/tls"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci-throwaway" \
          -keyout "$otlp/tls/server.key" -out "$otlp/tls/server.crt"
        sed "s|REPLACE_WITH_BCRYPT_HASH|$hash|" "$otlp/web.yml.example" > "$otlp/web.yml"
        chmod -R a+rX "$otlp"
        docker run --rm --entrypoint promtool -v "$otlp":/etc/prometheus:ro \
          prom/prometheus:v3.10.0 check config /etc/prometheus/prometheus.yml
        docker run --rm --entrypoint promtool -v "$otlp":/etc/prometheus:ro \
          prom/prometheus:v3.10.0 check web-config /etc/prometheus/web.yml
        docker run --rm --entrypoint amtool \
          -v "$PWD/docker/alertmanager/alertmanager.yml":/tmp/am.yml:ro \
          prom/alertmanager:v0.27.0 check-config /tmp/am.yml
        certs=$(mktemp -d)
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci-throwaway-ca" \
          -keyout "$certs/root-ca-key.pem" -out "$certs/root-ca.pem"
        chmod -R a+rX "$certs"
        docker run --rm \
          -e OPENSEARCH_LOGSTASH_PASSWORD=ci-only-placeholder \
          -v "$PWD/docker/logstash/pipeline":/usr/share/logstash/pipeline:ro \
          -v "$PWD/docker/logstash/logstash.yml":/usr/share/logstash/config/logstash.yml:ro \
          -v "$certs/root-ca.pem":/etc/logstash/certs/root-ca.pem:ro \
          opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0 \
          logstash --config.test_and_exit
        # Wazuh files are multi-root fragments, so wrap them before parsing. This is
        # the old xmllint well-formedness check in the standard library: xmllint is
        # not on the runner and installing it would need an apt mirror in the allow-list.
        python3 - <<'PY'
        import pathlib, sys
        import xml.etree.ElementTree as ET
        bad = 0
        for f in sorted(pathlib.Path("wazuh").rglob("*.xml")):
            try:
                ET.fromstring("<ossec_wrapper>" + f.read_text(encoding="utf-8") + "</ossec_wrapper>")
                print("OK  ", f)
            except ET.ParseError as e:
                print("FAIL", f, e)
                bad = 1
        sys.exit(bad)
        PY
        python3 scripts/check-wazuh-rule-ids.py wazuh
        python3 -m pytest tests/python -q
      # x86_64 only: the test pulls Docker Hub images (logstash-oss-with-opensearch-output-plugin
      # is not published for arm64). No distros: the checks are about this stack's configs, not an OS.
      runners: '["ubuntu-24.04"]'
      egress-policy: block
      # Docker Hub for the test's images (the list python-ci.yml measured), and the
      # four hosts the workflow-lint job needs (actionlint matcher and npm, zizmor image)
      extra-allowed-endpoints: auth.docker.io:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 production.cloudfront.docker.com:443 raw.githubusercontent.com:443 registry-1.docker.io:443 registry.npmjs.org:443

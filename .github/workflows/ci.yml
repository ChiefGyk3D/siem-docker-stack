# CI for siem-docker-stack. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
    with:
      shfmt-args: -i 4 -ci
      egress-policy: block
